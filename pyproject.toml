[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pai-stt"
version = "0.1.0"
description = "Linux desktop dictation client for PAI Cloud"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Frederik Berg" }
]
keywords = ["speech-to-text", "stt", "transcription", "dictation", "voice"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "websockets>=12.0",
    "pyyaml>=6.0",
    "dbus-next>=0.2.3",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/frederikb96/pai-stt"
Repository = "https://github.com/frederikb96/pai-stt"

[project.scripts]
pai-stt = "pai_stt.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pai_stt"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
