# pai-stt Configuration

log_level: info

pai_cloud:
  # Full wss:// URL of the PAI Cloud voice socket.
  socket_url: wss://your-pai-cloud-host/api/voice/socket

# Command printing the bearer token on stdout, run for every recording and
# re-transcription; the token is never stored or logged.
token_command: "secret get PAI_ANDROID_JWT"

# Max seconds to wait for the backend's receipt that a take is finished
transcription_timeout: 30

# Stop sending audio after a sustained quiet stretch (capture and the local
# recording continue). mode: auto adapts to the room; manual uses
# manual_threshold_db (dBFS, -70 to -20).
silence_gate:
  enabled: true
  mode: auto
  manual_threshold_db: -45

# Fixed gain applied to the audio the silence gate measures and the backend
# receives (-30 to 30 dB; 0 leaves it unchanged). The local recording stays
# as captured. Boosts the microphone noise by the same amount.
capture:
  gain_db: 0
