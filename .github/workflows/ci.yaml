name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install -e ".[dev]"
      - run: ruff check src/ tests/
      - run: mypy src/
      - run: python -m pytest tests/ -v

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: node --check extension/extension.js
      - run: node --check extension/prefs.js
      - run: python3 -c "import json; json.load(open('extension/metadata.json'))"
      - run: |
          python3 -c "
          import xml.dom.minidom
          xml.dom.minidom.parse('extension/schemas/org.gnome.shell.extensions.pai-stt.gschema.xml')
          "

  ci-ok:
    name: CI ok
    needs: [python, extension]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job did not succeed
        run: |
          for result in \
            "${{ needs.python.result }}" \
            "${{ needs.extension.result }}"; do
            if [ "$result" != "success" ]; then
              echo "A required job did not succeed: $result"
              exit 1
            fi
          done
